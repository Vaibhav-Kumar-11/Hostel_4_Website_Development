name: CI

# Type-checks and builds every push and pull request, so a broken commit is
# caught here rather than in a deploy.
#
# Deployment is handled by Vercel, which builds from this repository directly.
# GitHub Pages is available as an alternative — see docs/DEPLOYMENT.md for the
# workflow to add if you ever want it.

on:
  # Every branch, not just main, so work can be verified before it is merged.
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
